name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  database:
    name: Database (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      # Only Postgres is needed for pgTAP, so skip the rest of the stack.
      - run: supabase db start
      - run: supabase test db
      - name: Generated types match the schema
        run: |
          supabase gen types typescript --local > "$RUNNER_TEMP/database.types.ts"
          if ! diff -u web/src/lib/database.types.ts "$RUNNER_TEMP/database.types.ts"; then
            echo "::error::web/src/lib/database.types.ts is out of date. Run: supabase gen types typescript --local > web/src/lib/database.types.ts"
            echo "::group::Generated types (copy this if you can't run Supabase locally)"
            cat "$RUNNER_TEMP/database.types.ts"
            echo "::endgroup::"
            exit 1
          fi
