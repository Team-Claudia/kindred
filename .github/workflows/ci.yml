name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  functions:
    name: Edge Functions (Deno tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint supabase/functions/calendar-feed supabase/functions/outbox-worker supabase/functions/google-oauth supabase/functions/availability supabase/functions/account supabase/functions/static-map supabase/functions/_shared
      - run: deno check supabase/functions/calendar-feed/index.ts supabase/functions/outbox-worker/index.ts supabase/functions/push-test/index.ts supabase/functions/google-oauth/index.ts supabase/functions/availability/index.ts supabase/functions/account/index.ts supabase/functions/static-map/index.ts
      - run: deno test supabase/functions/

  database:
    name: Database (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The deploy's `supabase db push` refuses a migration older than the
      # newest one already on the hosted database, so a PR's new migrations
      # must sort after everything on main. Re-run this after main moves.
      - name: New migrations come after the ones on main
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE_REF"
          on_main=$(git ls-tree --name-only "origin/$BASE_REF" supabase/migrations/ | xargs -n1 basename | grep -E '^[0-9]{14}_.*\.sql$' | sort)
          latest=$(echo "$on_main" | tail -1)
          status=0
          for f in $(ls supabase/migrations | grep -E '^[0-9]{14}_.*\.sql$' | sort); do
            if ! grep -qxF "$f" <<<"$on_main" && [[ "$f" < "$latest" ]]; then
              echo "::error file=supabase/migrations/$f::$f is older than $latest on $BASE_REF. Rename it with a later timestamp."
              status=1
            fi
          done
          exit $status
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      # Only Postgres is needed for pgTAP, so skip the rest of the stack.
      - run: supabase db start
      # Rebuild from the migrations plus supabase/seed.sql, so a broken seed
      # fails here. pgTAP below then runs with the seed loaded.
      - run: supabase db reset
      - name: Seed has a circle with items in every state
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_missing text;
          begin
            select string_agg(s, ', ') into v_missing
            from unnest(array['needs_someone', 'awaiting_acceptance', 'assigned',
                              'needs_coverage', 'completed', 'cancelled']) as s
            where not exists (select 1 from public.items i where i.state = s);
            if v_missing is not null then
              raise exception 'seed has no items in: %', v_missing;
            end if;
            if (select count(*) from public.circle_members) < 3 then
              raise exception 'seed circle has fewer than 3 members';
            end if;
            if not exists (
              select 1 from public.items
              where starts_at < now()
                and state in ('needs_someone', 'awaiting_acceptance', 'assigned', 'needs_coverage')
            ) then
              raise exception 'seed has no Overdue item';
            end if;
            if not exists (select 1 from public.coverage_requests where status = 'open') then
              raise exception 'seed has no open coverage request';
            end if;
          end $$;
          select state, count(*) from public.items group by state order by state;
          SQL
      - run: supabase test db
      - name: Generated types match the schema
        run: |
          supabase gen types typescript --local > "$RUNNER_TEMP/database.types.ts"
          if ! diff -u --ignore-all-space --ignore-blank-lines web/src/lib/database.types.ts "$RUNNER_TEMP/database.types.ts"; then
            echo "::error::web/src/lib/database.types.ts is out of date. Run: supabase gen types typescript --local > web/src/lib/database.types.ts"
            echo "::group::Generated types (copy this if you can't run Supabase locally)"
            cat "$RUNNER_TEMP/database.types.ts"
            echo "::endgroup::"
            exit 1
          fi
